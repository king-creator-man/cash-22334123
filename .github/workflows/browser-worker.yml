name: Browser IP Worker

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to open"
        required: true
        type: string

      runtime_minutes:
        description: "Maximum runtime in minutes"
        required: false
        default: "350"
        type: string

      extra_wait_seconds:
        description: "Extra wait after page load"
        required: false
        default: "5"
        type: string

jobs:
  browser-worker:

    runs-on: ubuntu-latest

    timeout-minutes: 350

    permissions:
      contents: read

    env:
      TARGET_URL: ${{ inputs.target_url }}
      MAX_RUNTIME_MINUTES: ${{ inputs.runtime_minutes }}
      EXTRA_WAIT_SECONDS: ${{ inputs.extra_wait_seconds }}

      APIFY_PROXY_HOST: proxy.apify.com
      APIFY_PROXY_PORT: "8000"
      APIFY_PROXY_USERNAME: auto

      APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start browser worker
        run: npm start
